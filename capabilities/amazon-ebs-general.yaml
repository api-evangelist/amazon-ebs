naftiko: 1.0.0-alpha2
info:
  label: Amazon EBS Amazon Elastic Block Store (EBS) API
  description: 'Amazon EBS Amazon Elastic Block Store (EBS) API. 2 operations. Lead operation: Amazon EBS Describe Volumes.
    Self-contained Naftiko capability covering one Amazon Ebs business surface.'
  tags:
  - Amazon Ebs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_EBS_API_KEY: AMAZON_EBS_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-ebs-general
    baseUri: https://ec2.amazonaws.com
    description: Amazon EBS Amazon Elastic Block Store (EBS) API business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: describevolumes
        method: GET
        description: Amazon EBS Describe Volumes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        - name: VolumeId
          in: query
          type: array
          description: The volume IDs to describe.
        - name: MaxResults
          in: query
          type: integer
          description: The maximum number of volumes to return.
        - name: NextToken
          in: query
          type: string
          description: The token for the next set of results.
      - name: createvolume
        method: POST
        description: Amazon EBS Create Volume
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Action
          in: query
          type: string
          required: true
        - name: Version
          in: query
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_EBS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-ebs-general-rest
    port: 8080
    description: REST adapter for Amazon EBS Amazon Elastic Block Store (EBS) API. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: describevolumes
        description: Amazon EBS Describe Volumes
        call: amazon-ebs-general.describevolumes
        with:
          Action: rest.Action
          Version: rest.Version
          VolumeId: rest.VolumeId
          MaxResults: rest.MaxResults
          NextToken: rest.NextToken
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createvolume
        description: Amazon EBS Create Volume
        call: amazon-ebs-general.createvolume
        with:
          Action: rest.Action
          Version: rest.Version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-ebs-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon EBS Amazon Elastic Block Store (EBS) API. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: amazon-ebs-describe-volumes
      description: Amazon EBS Describe Volumes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-ebs-general.describevolumes
      with:
        Action: tools.Action
        Version: tools.Version
        VolumeId: tools.VolumeId
        MaxResults: tools.MaxResults
        NextToken: tools.NextToken
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-ebs-create-volume
      description: Amazon EBS Create Volume
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-ebs-general.createvolume
      with:
        Action: tools.Action
        Version: tools.Version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
